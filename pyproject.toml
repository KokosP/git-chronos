[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "git-chronos"
version = "0.1.0"
description = "Automatic time tracking and earnings calculation from local Git history."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "sbgid.com"}]
keywords = ["git", "time-tracking", "freelance", "invoice", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "typer>=0.9",
    "GitPython>=3.1.40",
    "toml>=0.10.2",
    "rich>=13.4",
    "openpyxl>=3.1.2",
]

[project.urls]
Homepage = "https://sbgid.com"

[project.scripts]
git-chronos = "git_chronos.cli:app"

[tool.setuptools.packages.find]
include = ["git_chronos*"]
